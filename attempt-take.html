<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Take test - OneHourNTPC</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="./admin/dashboard.css">
</head>
<body class="dashboard-page dashboard-page--erp" data-assessment-page="attempt-take">
	<div class="dashboard-layout dashboard-layout--erp">
		<div id="sidebar-host"></div>

		<main class="dashboard-main dashboard-main--erp">
			<div id="topbar-host"></div>

			<div class="dashboard-main-body dashboard-main-body--erp">
				<div class="dashboard-page-head">
					<div class="title-block">
						<h1>Attempt</h1>
						<p class="subtitle">Save each answer, then submit. Scoring: +1 per correct answer, −0.25 for each wrong answer. Unanswered items are not docked as wrong.</p>
					</div>
				</div>

				<div class="dashboard-message dashboard-message--erp" id="assessment-message"></div>
				<div id="attempt-questions" class="attempt-questions-wrap"></div>
				<div class="table-card table-card--erp" style="margin-top:1rem;padding:1rem;">
					<button type="button" class="primary-btn" id="submit-attempt-btn">Submit test</button>
					<a href="test-list.html" class="secondary-btn" style="display:inline-block;margin-left:0.5rem;">Back to tests</a>
				</div>
			</div>
		</main>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="./ntpc-constants.js"></script>
	<script src="./ntpc-framework.js"></script>
	<script src="./admin/sidebar-init.js"></script>
	<script src="./admin/message-notifications.js"></script>
	<script src="./admin/topbar-init.js"></script>
	<script>
		window.DASHBOARD_TOPBAR_BREADCRUMB = [
			{ href: 'dashboard.html', text: 'Assessment' },
			{ href: 'test-list.html', text: 'Tests' },
			{ text: 'Take test', current: true }
		];
	</script>
	<script src="./admin/assessment.js"></script>
</body>
</html>
