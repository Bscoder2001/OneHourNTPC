<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Students – OneHourNTPC</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="./admin/dashboard.css">
</head>
<body class="dashboard-page dashboard-page--erp">
	<div class="dashboard-layout dashboard-layout--erp">
		<div id="sidebar-host"></div>

		<main class="dashboard-main dashboard-main--erp">
			<div id="topbar-host"></div>

			<div class="dashboard-main-body dashboard-main-body--erp">
				<section class="dashboard-stats" aria-label="Summary">
					<div class="dashboard-stat-card">
						<div class="dashboard-stat-card-top">
							<div class="dashboard-stat-ico dashboard-stat-ico--teachers">
								<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
							</div>
							<span class="dashboard-stat-badge dashboard-stat-badge--green">—</span>
						</div>
						<div class="dashboard-stat-value" id="stat-card-teachers">—</div>
						<div class="dashboard-stat-label">Total teachers</div>
					</div>
					<div class="dashboard-stat-card">
						<div class="dashboard-stat-card-top">
							<div class="dashboard-stat-ico dashboard-stat-ico--students">
								<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
							</div>
							<span class="dashboard-stat-badge dashboard-stat-badge--green" id="stat-badge-students">—</span>
						</div>
						<div class="dashboard-stat-value" id="stat-card-students">0</div>
						<div class="dashboard-stat-label">Total students</div>
					</div>
					<div class="dashboard-stat-card">
						<div class="dashboard-stat-card-top">
							<div class="dashboard-stat-ico dashboard-stat-ico--cal">
								<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
							</div>
							<span class="dashboard-stat-badge dashboard-stat-badge--amber">Setup</span>
						</div>
						<div class="dashboard-stat-value" id="stat-card-ay">—</div>
						<div class="dashboard-stat-label">Academic year</div>
					</div>
					<div class="dashboard-stat-card">
						<div class="dashboard-stat-card-top">
							<div class="dashboard-stat-ico dashboard-stat-ico--reports">
								<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
							</div>
							<span class="dashboard-stat-badge dashboard-stat-badge--green">Live</span>
						</div>
						<div class="dashboard-stat-value" id="stat-card-reports">1</div>
						<div class="dashboard-stat-label">Reports active</div>
					</div>
				</section>

				<div class="dashboard-page-head">
					<div class="title-block">
						<h1>Students</h1>
						<p class="subtitle">Manage all students in your institution.</p>
					</div>
					<div class="dashboard-page-head-actions">
						<button type="button" class="btn-erp-outline" id="export-member-btn">
							<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
							Export
						</button>
						<button class="primary-btn btn-erp-primary" id="add-member-btn" type="button">
							<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
							Add Student
						</button>
					</div>
				</div>

				<div class="dashboard-message dashboard-message--erp" id="dashboard-message" role="status" aria-live="polite"></div>

				<div class="table-card table-card--erp">
					<div class="table-card-toolbar">
						<div>
							<div class="table-card-title">All Students</div>
							<div class="table-card-count"><span id="member-count">0 students</span> found</div>
						</div>
						<div class="table-card-toolbar-right">
							<label class="table-search-wrap">
								<span class="visually-hidden">Search students</span>
								<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
								<input type="search" class="table-search-input" id="member-search-input" placeholder="Search students…" autocomplete="off">
							</label>
							<button type="button" class="btn-erp-filter" id="member-filter-btn" aria-expanded="false">
								<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
								Filter
							</button>
						</div>
					</div>
					<div class="table-scroll">
						<table class="member-table member-table--erp">
							<thead>
								<tr>
									<th>Student</th>
									<th>Email</th>
									<th>Username</th>
									<th>Password</th>
									<th>Status</th>
									<th>Actions</th>
								</tr>
							</thead>
							<tbody id="member-table-body"></tbody>
						</table>
					</div>
					<div class="table-pagination table-pagination--erp" id="member-table-pagination" hidden>
						<p class="table-pagination-meta" id="member-pagination-meta"></p>
						<nav class="table-pagination-nav" aria-label="Table pagination">
							<button type="button" class="table-pagination-btn" id="member-page-first" aria-label="First page">«</button>
							<button type="button" class="table-pagination-btn" id="member-page-prev" aria-label="Previous page">‹</button>
							<span class="table-pagination-status" id="member-page-status"></span>
							<button type="button" class="table-pagination-btn" id="member-page-next" aria-label="Next page">›</button>
							<button type="button" class="table-pagination-btn" id="member-page-last" aria-label="Last page">»</button>
						</nav>
					</div>
				</div>
			</div>
		</main>
	</div>

	<div class="modal-overlay" id="member-modal-overlay">
		<div class="member-modal">
			<div class="modal-header">
				<h2 id="member-modal-title">Add Student</h2>
				<button type="button" class="icon-btn" id="member-modal-close" aria-label="Close">×</button>
			</div>
			<div class="modal-form">
				<input type="hidden" id="member-id">
				<div class="form-group">
					<label for="member-name" class="form-label">Name</label>
					<input type="text" id="member-name" class="form-input" placeholder="Full name" autocomplete="name">
				</div>
				<div class="form-group">
					<label for="member-email" class="form-label">Email</label>
					<input type="email" id="member-email" class="form-input" placeholder="Email" autocomplete="email">
				</div>
				<div class="form-group" id="member-username-group">
					<label for="member-username" class="form-label">Username</label>
					<input type="text" id="member-username" class="form-input" placeholder="Username" autocomplete="username">
				</div>
				<div class="form-group" id="member-password-group">
					<label for="member-password" class="form-label">Password</label>
					<div class="modal-password-wrap">
						<input type="password" id="member-password" class="form-input form-input--with-toggle" placeholder="Password" autocomplete="new-password">
						<button type="button" class="member-password-toggle" id="member-password-toggle" aria-label="Show password" aria-pressed="false">
							<span class="member-password-toggle__icon member-password-toggle__icon--show" aria-hidden="true">
								<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
							</span>
							<span class="member-password-toggle__icon member-password-toggle__icon--hide" aria-hidden="true">
								<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
							</span>
						</button>
					</div>
				</div>
				<div class="modal-actions">
					<button type="button" class="secondary-btn" id="member-modal-cancel">Cancel</button>
					<button type="button" class="primary-btn" id="member-modal-save">Save</button>
				</div>
			</div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="./ntpc-constants.js"></script>
	<script src="./ntpc-framework.js"></script>
	<script src="./admin/sidebar-init.js"></script>
	<script src="./admin/message-notifications.js"></script>
	<script src="./admin/topbar-init.js"></script>
	<script>
		window.MEMBER_PAGE = {
			userTypeId: typeof USER_TYPE_ID_STUDENT !== 'undefined' ? USER_TYPE_ID_STUDENT : 4,
			entitySingular: 'student',
			entityPlural: 'students',
			title: 'Students',
			modalAddTitle: 'Add Student',
			modalEditTitle: 'Edit Student',
			breadcrumb: [
				{ href: 'dashboard.html', text: 'Institution' },
				{ href: 'students-add.html', text: 'Students' },
				{ text: 'Add Student', current: true }
			]
		};
	</script>
	<script src="./admin/members-dashboard.js"></script>
</body>
</html>
