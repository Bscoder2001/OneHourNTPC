<div class="dashboard-topbar">
	<nav class="breadcrumb dashboard-breadcrumb--erp" aria-label="Breadcrumb">
		<ol class="breadcrumb-trail" id="dashboard-breadcrumb-trail"></ol>
	</nav>
	<div class="dashboard-topbar-actions">
		<div class="topbar-extra-actions" id="topbar-extra-actions"></div>
		<div class="dashboard-notify-wrap">
			<button type="button" class="dashboard-bell" id="dashboard-notify-bell" aria-label="Notifications" aria-expanded="false" aria-haspopup="true" aria-controls="dashboard-notify-panel">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
				<span class="dashboard-bell-dot" aria-hidden="true" hidden></span>
				<span class="dashboard-bell-count" id="dashboard-message-notify-badge" hidden></span>
			</button>
			<div class="dashboard-notify-panel" id="dashboard-notify-panel" role="region" aria-label="Message notifications" hidden>
				<div class="dashboard-notify-panel-head">
					<span class="dashboard-notify-panel-title">Notifications</span>
					<button type="button" class="dashboard-notify-mark-read" id="dashboard-notify-mark-read">Mark all as read</button>
				</div>
				<div class="dashboard-notify-list-scroll">
					<ul class="dashboard-notify-list" id="dashboard-notify-list"></ul>
					<p class="dashboard-notify-empty" id="dashboard-notify-empty">No notifications yet. New messages will appear here.</p>
				</div>
				<div class="dashboard-notify-footer">
					<a class="dashboard-notify-see-all" id="dashboard-notify-see-all" href="#">Open Messages</a>
				</div>
			</div>
		</div>
		<div class="dashboard-topbar-user-wrap">
			<button type="button" class="dashboard-user-av dashboard-user-av--menu" id="dashboard-top-user-menu" aria-expanded="false" aria-haspopup="dialog" aria-controls="dashboard-user-popover" title="Your account">
				<span id="dashboard-top-av" aria-hidden="true">·</span>
				<span class="visually-hidden">Open account summary</span>
			</button>
			<div class="dashboard-account-popover" id="dashboard-user-popover" role="dialog" aria-modal="true" aria-label="Signed in as" hidden>
				<div class="dashboard-account-popover-inner">
					<div class="dashboard-account-popover-accent" aria-hidden="true"></div>
					<div class="dashboard-account-popover-body">
						<div class="dashboard-account-popover-av" id="dashboard-popover-av" aria-hidden="true">·</div>
						<div class="dashboard-account-popover-text">
							<p class="dashboard-account-popover-label">Signed in as</p>
							<p class="dashboard-account-popover-name" id="dashboard-popover-name">—</p>
							<p class="dashboard-account-popover-username" id="dashboard-popover-username" hidden></p>
							<span class="dashboard-account-popover-role" id="dashboard-popover-role">—</span>
							<p class="dashboard-account-popover-email" id="dashboard-popover-email"></p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
