<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Admin Login – OneHourNTPC</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="./admin/admin.css">
</head>
<body class="admin-login-page">
	<main class="admin-login-container">
		<div class="login-wrapper">
			<div class="login-header">
				<div class="brand-row">
					<div class="brand-icon" aria-hidden="true">
						<svg viewBox="0 0 24 24" fill="none">
							<path d="M12 3l7 4v5c0 4.2-2.7 7.6-7 9-4.3-1.4-7-4.8-7-9V7l7-4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
							<path d="M9.5 12.2l1.8 1.8 3.4-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
						</svg>
					</div>
					<h1 class="login-title">OneHourNTPC Admin</h1>
				</div>
				<p class="login-subtitle">Secure access to Mission Mode control panel</p>
			</div>

			<section class="login-card">
				<form id="admin-login-form" class="login-form" novalidate>
					<div class="form-group">
						<label for="username" class="form-label">Username</label>
						<input
							type="text"
							id="username"
							name="username"
							class="form-input"
							placeholder="Enter your username"
							required
							autocomplete="username"
						>
						<span class="form-error" id="username-error"></span>
					</div>

					<div class="form-group">
						<label for="password" class="form-label">Password</label>
						<div class="input-wrap">
							<input
								type="password"
								id="password"
								name="password"
								class="form-input"
								placeholder="Enter your password"
								required
								autocomplete="current-password"
							>
							<button type="button" class="password-toggle" data-target="password" aria-label="Show password">Show</button>
						</div>
						<span class="form-error" id="password-error"></span>
					</div>

					<div class="form-row">
						<div class="checkbox-group">
							<input
								type="checkbox"
								id="remember-me"
								name="remember-me"
								class="form-checkbox"
							>
							<label for="remember-me" class="checkbox-label">Remember me</label>
						</div>
						<a href="#" class="login-link forgot-link" id="forgot-password-link">Forgot password?</a>
					</div>

					<button type="submit" class="login-btn">Sign in</button>

					<div class="form-error-message" id="form-error"></div>
					<div class="form-success-message" id="form-success"></div>
				</form>

				<div class="login-google-wrap">
					<p class="login-google-label">or continue with</p>
					<a id="google-login-link" class="google-login-btn" href="#" rel="noopener noreferrer" aria-label="Login with Google">
						<span class="google-login-btn__icon" aria-hidden="true">
							<svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
								<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
								<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
								<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
								<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
							</svg>
						</span>
						<span class="google-login-btn__text">Login with Google</span>
					</a>
				</div>

				<div class="otp-panel" id="otp-panel" aria-live="polite">
					<div class="otp-panel-header">
						<h3>Reset Password OTP</h3>
						<p>Enter your registered email to receive a 6-digit code.</p>
					</div>

					<div class="otp-form-grid">
						<div class="form-group">
							<label for="otp-email" class="form-label">Email address</label>
							<input
								type="email"
								id="otp-email"
								class="form-input"
								placeholder="Enter your registered email"
								autocomplete="email"
							>
							<span class="form-error" id="otp-email-error"></span>
						</div>

						<button type="button" class="otp-btn" id="send-otp-btn">Send OTP</button>
					</div>

					<div class="otp-verify-wrap" id="otp-verify-wrap">
						<div class="form-group">
							<label for="otp-code" class="form-label">OTP code</label>
							<input
								type="text"
								id="otp-code"
								class="form-input otp-input"
								placeholder="Enter 6-digit OTP"
								inputmode="numeric"
								maxlength="6"
								autocomplete="one-time-code"
							>
							<span class="form-error" id="otp-code-error"></span>
						</div>
						<button type="button" class="otp-btn" id="verify-otp-btn">Verify OTP</button>
					</div>

					<div class="otp-reset-wrap" id="otp-reset-wrap">
						<div class="form-group">
							<label for="reset-password" class="form-label">New password</label>
							<input
								type="password"
								id="reset-password"
								class="form-input"
								placeholder="Enter new password"
								autocomplete="new-password"
							>
							<span class="form-error" id="reset-password-error"></span>
						</div>
						<div class="form-group">
							<label for="reset-confirm-password" class="form-label">Confirm password</label>
							<input
								type="password"
								id="reset-confirm-password"
								class="form-input"
								placeholder="Confirm new password"
								autocomplete="new-password"
							>
							<span class="form-error" id="reset-confirm-password-error"></span>
						</div>
						<button type="button" class="otp-btn" id="reset-password-btn">Reset Password</button>
					</div>

					<div class="otp-message" id="otp-message"></div>
				</div>

				<div class="or-divider"><span>or</span></div>
				<div class="login-footer">
					<a href="#" class="login-link" id="create-account-link">Create new account</a>
				</div>
			</section>

			<div class="login-warning" role="note" aria-label="security warning">
				<div class="warning-icon" aria-hidden="true">!</div>
				<div class="warning-text">
					<strong>Authorized personnel only.</strong>
					<span>All activities are logged.</span>
				</div>
			</div>
		</div>
	</main>

	<!-- SCRIPTS -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="./ntpc-constants.js"></script>
	<script>
		(function () {
			function setGoogleOAuthHref() {
				var base = (typeof BASE_URL_LIVE !== 'undefined' && BASE_URL_LIVE)
					? String(BASE_URL_LIVE).trim()
					: (window.location.protocol + '//' + window.location.hostname + (window.location.port ? ':' + window.location.port : '') + '/');
				base = base.replace(/\/?$/, '');
				var a = document.getElementById('google-login-link');
				if (a) {
					a.href = base + '/api/auth/google';
				}
			}
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', setGoogleOAuthHref);
			} else {
				setGoogleOAuthHref();
			}
		})();
	</script>
	<script src="./ntpc-framework.js"></script>
	<script src="./admin/admin.js"></script>
</body>
</html>
