<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Question List - OneHourNTPC</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="./admin/dashboard.css">
</head>
<body class="dashboard-page dashboard-page--erp" data-assessment-page="question-list">
	<div class="dashboard-layout dashboard-layout--erp">
		<div id="sidebar-host"></div>

		<main class="dashboard-main dashboard-main--erp">
			<div id="topbar-host"></div>

			<div class="dashboard-main-body dashboard-main-body--erp">
				<div class="dashboard-page-head">
					<div class="title-block">
						<h1>Questions</h1>
						<p class="subtitle">Manage all questions in your question bank.</p>
					</div>
				</div>

				<div class="dashboard-message dashboard-message--erp" id="assessment-message"></div>

				<div class="table-card table-card--erp">
					<div class="table-card-toolbar">
						<div>
							<div class="table-card-title">Question Bank</div>
							<div class="table-card-count">Latest questions</div>
						</div>
					</div>
					<div class="table-scroll">
						<table class="member-table member-table--erp">
							<thead>
								<tr>
									<th>ID</th>
									<th>Question</th>
									<th>Type</th>
									<th>Difficulty</th>
									<th>Actions</th>
								</tr>
							</thead>
							<tbody id="question-table-body"></tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="./ntpc-constants.js"></script>
	<script src="./ntpc-framework.js"></script>
	<script src="./admin/sidebar-init.js"></script>
	<script src="./admin/message-notifications.js"></script>
	<script src="./admin/topbar-init.js"></script>
	<script>
		window.DASHBOARD_TOPBAR_BREADCRUMB = [
			{ href: 'dashboard.html', text: 'Assessment' },
			{ text: 'Question Bank', current: true }
		];
	</script>
	<script src="./admin/assessment.js"></script>
</body>
</html>
