<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Add Question - OneHourNTPC</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="./admin/dashboard.css">
</head>
<body class="dashboard-page dashboard-page--erp" data-assessment-page="question-add">
	<div class="dashboard-layout dashboard-layout--erp">
		<div id="sidebar-host"></div>

		<main class="dashboard-main dashboard-main--erp">
			<div class="dashboard-topbar">
				<nav class="breadcrumb dashboard-breadcrumb--erp" aria-label="Breadcrumb">
					<ol class="breadcrumb-trail">
						<li><a href="dashboard.html">Assessment</a></li>
						<li class="breadcrumb-sep" aria-hidden="true">/</li>
						<li><a href="question-list.html">Question Bank</a></li>
						<li class="breadcrumb-sep" aria-hidden="true">/</li>
						<li><span class="breadcrumb-current" aria-current="page">Add Question</span></li>
					</ol>
				</nav>
				<div class="dashboard-topbar-actions">
					<button type="button" class="dashboard-bell" aria-label="Notifications">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
						<span class="dashboard-bell-dot" aria-hidden="true"></span>
					</button>
					<div class="dashboard-user-av" aria-hidden="true">A</div>
				</div>
			</div>

			<div class="dashboard-main-body dashboard-main-body--erp">
				<div class="dashboard-page-head">
					<div class="title-block">
						<h1>Add Question</h1>
						<p class="subtitle">Create MCQ or numeric questions for your bank.</p>
					</div>
				</div>

				<div class="dashboard-message dashboard-message--erp" id="assessment-message"></div>

				<div class="table-card table-card--erp">
					<div class="modal-form">
						<div class="form-group">
							<label class="form-label" for="course-id">Course</label>
							<select id="course-id" class="form-input"></select>
						</div>
						<div class="form-group">
							<label class="form-label" for="subject-id">Subject</label>
							<select id="subject-id" class="form-input"></select>
						</div>
						<div class="form-group">
							<label class="form-label" for="chapter-id">Chapter</label>
							<select id="chapter-id" class="form-input"></select>
						</div>
						<div class="form-group">
							<label class="form-label" for="topic-id">Topic</label>
							<select id="topic-id" class="form-input"></select>
						</div>
						<div class="form-group">
							<label class="form-label" for="question-type">Question Type</label>
							<select id="question-type" class="form-input">
								<option value="mcq">MCQ</option>
								<option value="numeric">Numeric</option>
							</select>
						</div>
						<div class="form-group">
							<label class="form-label" for="difficulty">Difficulty</label>
							<select id="difficulty" class="form-input">
								<option value="easy">Easy</option>
								<option value="medium">Medium</option>
								<option value="hard">Hard</option>
							</select>
						</div>
						<div class="form-group">
							<label class="form-label" for="question-text">Question Text</label>
							<textarea id="question-text" class="form-input" rows="4"></textarea>
						</div>
						<div id="mcq-options-wrap">
							<div class="form-group">
								<label class="form-label" for="option-1">Option 1</label>
								<input type="text" id="option-1" class="form-input">
							</div>
							<div class="form-group">
								<label class="form-label" for="option-2">Option 2</label>
								<input type="text" id="option-2" class="form-input">
							</div>
							<div class="form-group">
								<label class="form-label" for="option-3">Option 3</label>
								<input type="text" id="option-3" class="form-input">
							</div>
							<div class="form-group">
								<label class="form-label" for="option-4">Option 4</label>
								<input type="text" id="option-4" class="form-input">
							</div>
							<div class="form-group">
								<label class="form-label" for="correct-option">Correct Option</label>
								<select id="correct-option" class="form-input">
									<option value="1">1</option>
									<option value="2">2</option>
									<option value="3">3</option>
									<option value="4">4</option>
								</select>
							</div>
						</div>
						<div id="numeric-wrap" class="form-group" hidden>
							<label class="form-label" for="numeric-answer">Correct Numeric Answer</label>
							<input type="text" id="numeric-answer" class="form-input">
						</div>
						<div class="modal-actions">
							<button type="button" class="primary-btn" id="save-question-btn">Save Question</button>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="./ntpc-constants.js"></script>
	<script src="./ntpc-framework.js"></script>
	<script src="./admin/sidebar-init.js"></script>
	<script src="./admin/assessment.js"></script>
</body>
</html>
