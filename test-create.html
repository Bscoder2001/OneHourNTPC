<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create Test - OneHourNTPC</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="./admin/dashboard.css">
</head>
<body class="dashboard-page dashboard-page--erp" data-assessment-page="test-create">
	<div class="dashboard-layout dashboard-layout--erp">
		<div id="sidebar-host"></div>

		<main class="dashboard-main dashboard-main--erp">
			<div id="topbar-host"></div>

			<div class="dashboard-main-body dashboard-main-body--erp">
				<div class="dashboard-page-head">
					<div class="title-block">
						<h1>Create Test</h1>
						<p class="subtitle">Create a test and add questions from the bank in the order you want them to appear.</p>
					</div>
				</div>

				<div class="dashboard-message dashboard-message--erp" id="assessment-message"></div>

				<div class="table-card table-card--erp">
					<div class="modal-form">
						<div class="form-group">
							<label class="form-label" for="test-title">Title</label>
							<input id="test-title" class="form-input">
						</div>
						<div class="form-group">
							<label class="form-label" for="test-description">Description</label>
							<textarea id="test-description" class="form-input" rows="3"></textarea>
						</div>
						<div class="form-group">
							<label class="form-label" for="test-duration">Duration (minutes)</label>
							<input type="number" id="test-duration" class="form-input">
						</div>
						<div class="form-group">
							<label class="form-label">Question bank (add to test in order)</label>
							<div id="test-question-bank" class="table-card table-card--erp" style="max-height:220px;overflow:auto;padding:0.5rem;margin-bottom:0.75rem;"></div>
							<label class="form-label" for="test-question-ordered">Selected questions (order = test order; remove to take out)</label>
							<ol id="test-question-ordered" class="form-input" style="min-height:4rem;list-style:decimal;padding-left:1.5rem;margin:0;"></ol>
						</div>
						<div class="modal-actions">
							<button type="button" class="primary-btn" id="create-test-btn">Create Test</button>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="./ntpc-constants.js"></script>
	<script src="./ntpc-framework.js"></script>
	<script src="./admin/sidebar-init.js"></script>
	<script src="./admin/message-notifications.js"></script>
	<script src="./admin/topbar-init.js"></script>
	<script>
		window.DASHBOARD_TOPBAR_BREADCRUMB = [
			{ href: 'dashboard.html', text: 'Assessment' },
			{ href: 'test-list.html', text: 'Tests' },
			{ text: 'Create Test', current: true }
		];
	</script>
	<script src="./admin/assessment.js"></script>
</body>
</html>
